<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>GPU 负载测试 - GameFPS 验证用</title>
<style>
  html,body{margin:0;padding:0;background:#0b0b0f;overflow:hidden;height:100%}
  canvas{display:block;width:100vw;height:100vh}
  #hud{position:fixed;left:12px;top:12px;color:#7fffd4;font:14px/1.5 Consolas,monospace;
       text-shadow:0 0 6px #000;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<script>
const c = document.getElementById('c');
const gl = c.getContext('webgl', { antialias: true });
const hud = document.getElementById('hud');

function resize(){
  c.width  = Math.floor(window.innerWidth  * devicePixelRatio);
  c.height = Math.floor(window.innerHeight * devicePixelRatio);
  gl.viewport(0,0,c.width,c.height);
}
window.addEventListener('resize', resize); resize();

const vs = gl.createShader(gl.VERTEX_SHADER);
gl.shaderSource(vs, 'attribute vec2 p; uniform float t; void main(){ float s=sin(t),k=cos(t); gl_Position=vec4(p.x*k-p.y*s, p.x*s+p.y*k, 0.0, 1.0); }');
gl.compileShader(vs);

const fs = gl.createShader(gl.FRAGMENT_SHADER);
gl.shaderSource(fs, 'precision mediump float; uniform float t; void main(){ gl_FragColor=vec4(abs(sin(t)),0.35,0.65,1.0); }');
gl.compileShader(fs);

const prog = gl.createProgram();
gl.attachShader(prog, vs); gl.attachShader(prog, fs); gl.linkProgram(prog); gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-0.7,-0.7, 0.7,-0.7, 0.0,0.7]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, 'p');
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
const uT = gl.getUniformLocation(prog, 't');

let t = 0, frames = 0, t0 = performance.now();
function frame(){
  t += 0.02;
  gl.uniform1f(uT, t);
  gl.clearColor(0.05,0.05,0.1,1);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  frames++;
  const now = performance.now();
  if (now - t0 >= 500){
    hud.textContent = 'Page FPS: ' + (frames*1000/(now-t0)).toFixed(1) + '\n分辨率: ' + c.width + 'x' + c.height;
    frames = 0; t0 = now;
  }
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
